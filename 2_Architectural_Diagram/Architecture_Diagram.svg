<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#333"/></marker></defs>
<rect width="1120" height="760" fill="#fff"/>
<text x="40" y="28" font-size="18" font-weight="bold">Architecture Diagram – Disaster Relief Supply &amp; Volunteer Coordinator</text>
<text x="40" y="46" font-size="12" fill="#555">Style: layered (4-tier) modular architecture, offline-first web client. Technologies shown are proposed, not mandated by the problem statement.</text>
<rect x="60" y="60" width="190" height="34" rx="6" fill="#fff3cd" stroke="#8a6d0b" stroke-width="1.5"/>
<text x="155.0" y="81" font-size="13" text-anchor="middle" font-weight="bold">Relief Volunteer</text>
<rect x="290" y="60" width="190" height="34" rx="6" fill="#fff3cd" stroke="#8a6d0b" stroke-width="1.5"/>
<text x="385.0" y="81" font-size="13" text-anchor="middle" font-weight="bold">Disaster Manager</text>
<rect x="520" y="60" width="190" height="34" rx="6" fill="#fff3cd" stroke="#8a6d0b" stroke-width="1.5"/>
<text x="615.0" y="81" font-size="13" text-anchor="middle" font-weight="bold">Shelter Coordinator</text>
<rect x="870" y="60" width="220" height="34" rx="6" fill="#fff3cd" stroke="#8a6d0b" stroke-width="1.5"/>
<text x="980.0" y="74" font-size="12.5" text-anchor="middle" font-weight="bold">GPS Tracking Service</text>
<text x="980.0" y="88" font-size="10.5" text-anchor="middle">(vehicle location feed)</text>
<line x1="155" y1="94" x2="155" y2="115" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="385" y1="94" x2="385" y2="115" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="615" y1="94" x2="615" y2="115" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<line x1="980" y1="94" x2="980" y2="232" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="992" y="170" font-size="11" font-style="italic">location pings</text>
<rect x="40" y="115" width="780" height="90" rx="8" fill="#eaf2fb" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="52" y="134" font-size="13" font-weight="bold" fill="#1d3f66">1. PRESENTATION LAYER – React PWA (offline-first, runs on low-bandwidth mobile)</text>
<rect x="52" y="145" width="181" height="48" rx="6" fill="#fff" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="142.5" y="166.0" font-size="11" text-anchor="middle">Manager Dashboard + GIS Map</text>
<text x="142.5" y="182.0" font-size="10" text-anchor="middle" fill="#444">needs, stock, convoys</text>
<rect x="245" y="145" width="181" height="48" rx="6" fill="#fff" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="335.5" y="166.0" font-size="11" text-anchor="middle">Shelter Requisition Form</text>
<text x="335.5" y="182.0" font-size="10" text-anchor="middle" fill="#444">submit supply needs</text>
<rect x="438" y="145" width="181" height="48" rx="6" fill="#fff" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="528.5" y="166.0" font-size="11" text-anchor="middle">Volunteer Task App</text>
<text x="528.5" y="182.0" font-size="10" text-anchor="middle" fill="#444">accept, update delivery</text>
<rect x="631" y="145" width="181" height="48" rx="6" fill="#fff" stroke="#2E5E8C" stroke-width="1.5"/>
<text x="721.5" y="166.0" font-size="11" text-anchor="middle">Offline Cache &amp; Sync</text>
<text x="721.5" y="182.0" font-size="10" text-anchor="middle" fill="#444">Service Worker + IndexedDB</text>
<line x1="430" y1="205" x2="430" y2="232" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="442" y="224" font-size="11.5" font-style="italic">REST + JSON over HTTPS (JWT), gzip-compressed delta sync</text>
<rect x="40" y="232" width="780" height="82" rx="8" fill="#eaf6ea" stroke="#2e7d32" stroke-width="1.5"/>
<text x="52" y="251" font-size="13" font-weight="bold" fill="#1b5e20">2. API LAYER – Node.js + Express</text>
<rect x="52" y="262" width="181" height="40" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="142.5" y="286.0" font-size="11.5" text-anchor="middle">JWT Authentication</text>
<rect x="245" y="262" width="181" height="40" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="335.5" y="286.0" font-size="11.5" text-anchor="middle">Role-Based Access Control</text>
<rect x="438" y="262" width="181" height="40" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="528.5" y="286.0" font-size="11.5" text-anchor="middle">Input Validation</text>
<rect x="631" y="262" width="181" height="40" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
<text x="721.5" y="286.0" font-size="11.5" text-anchor="middle">Audit Log / Error Handling</text>
<line x1="430" y1="314" x2="430" y2="340" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="442" y="333" font-size="11.5" font-style="italic">calls service modules</text>
<rect x="40" y="340" width="780" height="214" rx="8" fill="#fdf1e6" stroke="#b45f06" stroke-width="1.5"/>
<text x="52" y="359" font-size="13" font-weight="bold" fill="#7f3f00">3. BUSINESS LOGIC LAYER – service modules</text>
<rect x="52" y="368" width="181" height="50" rx="6" fill="#fff" stroke="#b45f06" stroke-width="1.5"/>
<text x="142.5" y="390.0" font-size="11" text-anchor="middle">Requisition &amp; Priority</text>
<text x="142.5" y="406.0" font-size="10" text-anchor="middle" fill="#444">UC-01 · FR-001</text>
<rect x="245" y="368" width="181" height="50" rx="6" fill="#fff" stroke="#b45f06" stroke-width="1.5"/>
<text x="335.5" y="390.0" font-size="11" text-anchor="middle">Allocation &amp; Inventory</text>
<text x="335.5" y="406.0" font-size="10" text-anchor="middle" fill="#444">UC-02/03/04 · FR-002</text>
<rect x="438" y="368" width="181" height="50" rx="6" fill="#fff" stroke="#b45f06" stroke-width="1.5"/>
<text x="528.5" y="390.0" font-size="11" text-anchor="middle">Volunteer Dispatch</text>
<text x="528.5" y="406.0" font-size="10" text-anchor="middle" fill="#444">UC-05/06/07/12 · FR-003</text>
<rect x="631" y="368" width="181" height="50" rx="6" fill="#fff" stroke="#b45f06" stroke-width="1.5"/>
<text x="721.5" y="390.0" font-size="11" text-anchor="middle">Delivery Tracking</text>
<text x="721.5" y="406.0" font-size="10" text-anchor="middle" fill="#444">UC-08/09/10 · FR-004</text>
<rect x="52" y="432" width="181" height="50" rx="6" fill="#fff" stroke="#b45f06" stroke-width="1.5"/>
<text x="142.5" y="454.0" font-size="11" text-anchor="middle">Reporting Service</text>
<text x="142.5" y="470.0" font-size="10" text-anchor="middle" fill="#444">UC-11 · FR-005</text>
<rect x="245" y="432" width="181" height="50" rx="6" fill="#fff" stroke="#b45f06" stroke-width="1.5"/>
<text x="335.5" y="454.0" font-size="11" text-anchor="middle">Sync Service</text>
<text x="335.5" y="470.0" font-size="10" text-anchor="middle" fill="#444">offline queue merge · NFR-001</text>
<rect x="438" y="432" width="181" height="50" rx="6" fill="#fff" stroke="#b45f06" stroke-width="1.5"/>
<text x="528.5" y="454.0" font-size="11" text-anchor="middle">Auth &amp; User Service</text>
<text x="528.5" y="470.0" font-size="10" text-anchor="middle" fill="#444">register, verify · NFR-002</text>
<rect x="631" y="432" width="181" height="50" rx="6" fill="#fff" stroke="#b45f06" stroke-width="1.5"/>
<text x="721.5" y="454.0" font-size="11" text-anchor="middle">Notification Service</text>
<text x="721.5" y="470.0" font-size="10" text-anchor="middle" fill="#444">dispatch + delay alerts</text>
<text x="52" y="506" font-size="11" fill="#555">Business rules enforced here: critical items (water, medical kits) are dispatched first; stock allocation is atomic so
</text><text x="52" y="522" font-size="11" fill="#555">stock is never double-allocated; only verified users act; every allocation change is audit-logged.</text>
<line x1="430" y1="554" x2="430" y2="580" stroke="#333" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="442" y="574" font-size="11.5" font-style="italic">SQL queries (transactions)</text>
<rect x="40" y="580" width="780" height="100" rx="8" fill="#f1eaf7" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="52" y="599" font-size="13" font-weight="bold" fill="#4a2a73">4. DATA LAYER – PostgreSQL + PostGIS (spatial index for shelter / vehicle maps)</text>
<rect x="52" y="620" width="88" height="44" rx="6" fill="#fff" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="96.0" y="646.0" font-size="11" text-anchor="middle">users</text>
<rect x="148" y="620" width="88" height="44" rx="6" fill="#fff" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="192.0" y="646.0" font-size="11" text-anchor="middle">shelters</text>
<rect x="244" y="620" width="88" height="44" rx="6" fill="#fff" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="288.0" y="646.0" font-size="11" text-anchor="middle">requisitions</text>
<rect x="340" y="620" width="88" height="44" rx="6" fill="#fff" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="384.0" y="646.0" font-size="11" text-anchor="middle">inventory</text>
<rect x="436" y="620" width="88" height="44" rx="6" fill="#fff" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="480.0" y="646.0" font-size="11" text-anchor="middle">allocations</text>
<rect x="532" y="620" width="88" height="44" rx="6" fill="#fff" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="576.0" y="646.0" font-size="11" text-anchor="middle">volunteers</text>
<rect x="628" y="620" width="88" height="44" rx="6" fill="#fff" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="672.0" y="646.0" font-size="11" text-anchor="middle">deliveries</text>
<rect x="724" y="620" width="88" height="44" rx="6" fill="#fff" stroke="#6a3d9a" stroke-width="1.5"/>
<text x="768.0" y="646.0" font-size="11" text-anchor="middle">audit_log</text>
<rect x="850" y="232" width="240" height="250" rx="8" fill="#f2f2f2" stroke="#777" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="862" y="254" font-size="13" font-weight="bold" fill="#333">EXTERNAL</text>
<rect x="862" y="266" width="216" height="56" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="970.0" y="291.0" font-size="11" text-anchor="middle">GPS / Telematics Provider</text>
<text x="970.0" y="307.0" font-size="10" text-anchor="middle" fill="#444">vehicle position pings</text>
<rect x="862" y="340" width="216" height="62" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="970.0" y="368.0" font-size="11" text-anchor="middle">SMS / Push Gateway</text>
<text x="970.0" y="384.0" font-size="10" text-anchor="middle" fill="#444">dispatch alerts to volunteers</text>
<rect x="862" y="414" width="216" height="62" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
<text x="970.0" y="442.0" font-size="11" text-anchor="middle">Map Tile Server (OSM)</text>
<text x="970.0" y="458.0" font-size="10" text-anchor="middle" fill="#444">tiles cached offline by PWA</text>
<line x1="862" y1="294" x2="812" y2="385" stroke="#333" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="812" y1="457" x2="862" y2="371" stroke="#333" stroke-width="1.6" marker-end="url(#ar)" stroke-dasharray="5 3"/>
<text x="826" y="425" font-size="10.5" font-style="italic" fill="#333" text-anchor="middle">push</text>
<text x="40" y="710" font-size="12">Request flow: Actor → React PWA (works offline, syncs when online) → Express API (auth + validation) → service module → PostgreSQL.</text>
<text x="40" y="728" font-size="12">Offline-first PWA caches map tiles and last-synced shelter data (NFR-001); the API enforces verified, role-based access (NFR-002). Dashed grey box = third-party service.</text>
</svg>